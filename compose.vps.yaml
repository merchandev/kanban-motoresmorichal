# Archivo autónomo. No mezclar con compose.yaml: evita heredar 80/443 del entorno local.
name: ${COMPOSE_PROJECT_NAME:-tallerflow-morichal}
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallerflow
      POSTGRES_USER: tallerflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure una clave nueva de PostgreSQL}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tallerflow -d tallerflow]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    labels:
      traefik.enable: "false"
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    cpus: ${DB_CPU_LIMIT:-0.75}
    security_opt: [no-new-privileges:true]
  api:
    image: ${COMPOSE_PROJECT_NAME:-tallerflow-morichal}-api:${APP_VERSION:-local}
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://tallerflow:${POSTGRES_PASSWORD}@db:5432/tallerflow
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configure ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure una clave nueva de administrador}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    networks: [backend]
    labels:
      traefik.enable: "false"
    mem_limit: ${API_MEMORY_LIMIT:-1024m}
    cpus: ${API_CPU_LIMIT:-1.0}
    security_opt: [no-new-privileges:true]
  web:
    image: ${COMPOSE_PROJECT_NAME:-tallerflow-morichal}-web:${APP_VERSION:-local}
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: :80
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-18090}:80/tcp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    labels:
      traefik.enable: "false"
    mem_limit: ${WEB_MEMORY_LIMIT:-128m}
    cpus: ${WEB_CPU_LIMIT:-0.50}
    security_opt: [no-new-privileges:true]
volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
networks:
  backend:
    driver: bridge
