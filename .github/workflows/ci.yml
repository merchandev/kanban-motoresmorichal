name: Validar versión
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: docker build -t tallerflow-ci-web ./web
      - run: npm run test:flow
      - run: npm run test:vps
      - name: Rechazar secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '^\.env(\.vps)?\.example$'; then
            echo 'Configuración secreta versionada'; exit 1
          fi
      - name: Comprobar historial de cambios
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" HEAD | grep -qx historial.md || { echo 'Falta actualizar historial.md'; exit 1; }
          fi
